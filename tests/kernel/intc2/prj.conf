CONFIG_ZTEST=y
CONFIG_INTC2=y
CONFIG_IRQ_OFFLOAD=y
# This suite exercises the generic software-dispatch-table mechanism
# with its own emulated controllers; on x86 the real IOAPIC/LOAPIC are
# self-dispatching (INTC2_ARCH_VECTORED), which is incompatible with
# table-based nodes, so keep the platform APIC intc2 nodes out of it
# (x86's real intc2 path is covered by intc_x86_apic_intc2).
CONFIG_INTC2_X86_APIC=n
