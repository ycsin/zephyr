common:
  tags:
    - kernel
    - interrupt
  # one QEMU platform per architecture port, plus native_sim
  platform_allow:
    - native_sim
    - qemu_cortex_m3
    - qemu_cortex_a9
    - qemu_cortex_a53
    - qemu_x86
    - qemu_x86_64
    - qemu_riscv32
    - qemu_riscv64
    - qemu_leon3
    - qemu_malta
    - qemu_or1k
    - qemu_arc/qemu_arc_em
    - qemu_rx
    - qemu_xtensa/dc233c
  integration_platforms:
    - native_sim
tests:
  kernel.intc2.base: {}
  kernel.intc2.shared:
    extra_configs:
      - CONFIG_INTC2_SHARED=y
  kernel.intc2.dynamic:
    extra_configs:
      - CONFIG_INTC2_DYNAMIC=y
  kernel.intc2.dynamic_shared:
    extra_configs:
      - CONFIG_INTC2_SHARED=y
      - CONFIG_INTC2_DYNAMIC=y
  kernel.intc2.affinity:
    extra_configs:
      - CONFIG_INTC2_AFFINITY=y
  kernel.intc2.alloc:
    extra_configs:
      - CONFIG_INTC2_ALLOC=y
      - CONFIG_INTC2_MSI=y
